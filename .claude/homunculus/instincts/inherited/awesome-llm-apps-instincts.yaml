# Awesome Llm Apps Workflow Add New Agent App

## Action

Follow the add-new-agent-app workflow:
1. Create a new directory under the appropriate agent apps folder (e.g., advanced_ai_agents/autonomous_game_playing_agent_apps/ or advanced_ai_agents/multi_agent_apps/).
2. Add main implementation file(s) (e.g., agent.py, app.py, or similar).
